[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "careagent"
version = "2.0.0"
description = "Multi-agent comparison of Medicare billing patterns with same-specialty peers"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "python-dotenv>=1.0.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "loguru>=0.7.2",
    "sqlalchemy>=2.0.28",
    "psycopg2-binary>=2.9.9",
    "pandas>=2.2.1",
    "numpy>=1.26.4",
    "scikit-learn>=1.4.1",
    "langgraph>=0.0.38",
    "langsmith>=0.1.27",
    "openai>=1.14.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.32.0",
    "requests>=2.31.0",
]
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.5",
    "httpx>=0.27.0",
    "ruff==0.17.5",
    "mypy>=1.9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=careagent --cov-report=term-missing --cov-fail-under=85"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# Pin the rule set so new ruff releases don't change what CI checks
select = ["E4", "E7", "E9", "F"]
