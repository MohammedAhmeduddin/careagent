name: CareAgent CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (unit + PostgreSQL integration) + coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: careagent
          POSTGRES_PASSWORD: careagent_dev
          POSTGRES_DB: careagent_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careagent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_USER: careagent
      POSTGRES_PASSWORD: careagent_dev
      POSTGRES_DB: careagent_db
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_SSLMODE: disable
      RUN_INTEGRATION: "1"
      OPENAI_API_KEY: ""
      LOG_LEVEL: WARNING
      APP_ENV: test

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run all tests with whole-package coverage
        run: PYTHONPATH=src:. pytest -v

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install "ruff==0.17.5"
      - run: ruff check src/ tests/ scripts/ app.py
