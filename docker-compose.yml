version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: careagent_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: careagent
      POSTGRES_PASSWORD: careagent_dev
      POSTGRES_DB: careagent_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careagent"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
